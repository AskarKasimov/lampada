locale: ru
slides:
  - id: hero
    label: Главный
    title:
      - Православие
      - "по 5 минут в день."
    subtitle:
      - "Открыл, прочитал, закрыл."
      - "Непрочитанное не копится."
    theme: light
    screenshot: 01-today.png
  - id: session
    label: Мудрость дня
    title:
      - "Мудрость дня"
      - "в одной листалке."
    subtitle:
      - "Цитата, совет, притча"
      - "и Евангелие каждый день."
    theme: dark
    screenshot: 02-card.png
  - id: gospel
    label: Евангелие
    title:
      - "Читайте Евангелие"
      - "с толкованием."
    subtitle:
      - "Стих за стихом —"
      - "с объяснением святых отцов."
    theme: light
    screenshot: 03-gospel.png
    # Панель толкования затемняет весь фон, включая системную строку.
    status_bar_background: "#736e68"
  - id: bible
    label: Библия
    title:
      - "Вся Библия —"
      - "стих за стихом."
    subtitle:
      - "Место чтения сохраняется."
      - "Скачанные главы — без сети."
    theme: light
    screenshot: 06-bible.png
  - id: course
    label: Курс
    title:
      - "Курс «Основы веры»"
      - "из 365 тем."
    subtitle:
      - "Продолжайте с того места,"
      - "где остановились."
    theme: dark
    screenshot: 04-course.png
  - id: story
    label: Память дня
    title:
      - "Кого Церковь"
      - "вспоминает сегодня."
    subtitle:
      - "Праздник, святой"
      - "и рассказ о нём."
    theme: light
    screenshot: 05-story.png
