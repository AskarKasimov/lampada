name: lampada
description: "Короткая ежедневная православная сессия."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  flutter_riverpod: ^3.3.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.5
  http: ^1.6.0
  html: ^0.15.6
  connectivity_plus: ^7.3.1
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  in_app_review: ^2.0.12
  flutter_rustore_review: ^10.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.1
  share_plus_platform_interface: ^7.2.0

  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  flutter_launcher_icons: ^0.14.4
  image: ">=4.0.0 <4.9.0"
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    # Марка приложения: та же лампада, что на иконке, но с прозрачным фоном.
    - assets/brand/lampada.png

  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Italic.ttf
          style: italic

# Перед генерацией iOS-иконки: `dart run tool/make_ios_icon.dart`.
# После `flutter_launcher_icons` проверьте, что
# ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS остаётся YES.
flutter_launcher_icons:
  image_path: "assets/icon/icon_ios.png"
  android: true
  ios: true
  # App Store отклоняет иконку с альфа-каналом. Генератор тащит его из
  # исходника даже когда тот RGB, поэтому снимаем явно.
  remove_alpha_ios: true
  adaptive_icon_background: "#F7EFE2"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  # Pixel маскирует adaptive icon кругом; с нулевым отступом крайние части
  # лампады обрезались. 20% удерживает весь рисунок в безопасной зоне.
  adaptive_icon_foreground_inset: 20
